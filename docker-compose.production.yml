services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fmlcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-fmlcore}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fmlcore}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fmlcore}
      APP_ENV: production
      SAME_SKY_WORKER_MANAGED: "true"
      COOKIE_SECURE: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 60s

  same-sky-worker:
    build: ./backend
    command: ["python", "-m", "app.same_sky_worker"]
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fmlcore}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fmlcore}
      APP_ENV: production
      SAME_SKY_WORKER_MANAGED: "true"
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./front-end
      args:
        API_ORIGIN: http://api:8000
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

  admin-web:
    build:
      context: ./backend-front-end
      args:
        API_ORIGIN: http://api:8000
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3001:3001"

volumes:
  postgres_data:
  uploads_data:
